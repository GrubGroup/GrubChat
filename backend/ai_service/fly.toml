# fly.toml app configuration file generated for grubgroup-ai on 2026-07-23T02:13:46-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'grubgroup-ai'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Must match app/core/config.py and the vectors stored in the shared Render DB.
  # Vectors from different embedding models are NOT comparable — if this drifts from
  # the model used to embed Restaurant rows, cosine ranking silently returns garbage
  # (no error). Changing it requires re-embedding every row:
  #   uv run python -m scripts.backfill_embeddings --all
  EMBEDDING_MODEL = 'perplexity/pplx-embed-v1-0.6b'
  ENV = 'production'
  JWT_ALGORITHM = 'HS256'
  LLM_MODEL = 'anthropic/claude-sonnet-5'
  OPENROUTER_BASE_URL = 'https://openrouter.ai/api/v1'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

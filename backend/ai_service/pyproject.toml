[project]
name = "ai-service"
version = "0.1.0"
description = "GrubGroup AI/data service: FastAPI + SQLModel, LangGraph agent pipeline, pgvector RAG, and the cascaded STT/TTS voice loop."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    # SQLAlchemy's async engine (used by our asyncpg sessions) requires greenlet at
    # runtime, but SQLAlchemy 2.0.x only auto-installs it on select platforms — its
    # dependency marker omits macOS arm64 (platform_machine == 'arm64'), so uv skips
    # it there. Declare it explicitly so `uv sync` installs it on every dev machine.
    "greenlet>=3.5.3",
    "fastapi[standard]>=0.138.2",
    "httpx>=0.28.1",
    "langgraph>=1.2.7",
    "openai>=2.44.0",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlmodel>=0.0.39",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "sounddevice>=0.5.5",
]
